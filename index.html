<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile Card</title>
    <style>
        body{
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 60px 20px;
        }
        .profile-card{
            width: 440px;
            max-width: 100%;
            margin: 0 auto;
            padding: 25px;
            background-color: white;
            border-radius: 30px;
            text-align: center;
            box-shadow: -15px -15px 35px #4a2cf0,
                   15px  15px 35px #f9a50b;
        }
        .profile-image{
            width: 120px;
            height: 120px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background-color: #cfe0ff;
            font-size: 70px;
            line-height: 120px;
        }
        h1{
            font-family: Georgia, serif;
            font-size: 32px;
            letter-spacing: 2px;
            margin: 0 0 15px;
            text-decoration: underline;
            text-decoration-color: #a855f7;
            text-decoration-thickness: 2px;
        }
        h2{
            font-size: 24px;
            font-weight: bold;
            color: #7e03d6;
            letter-spacing: 3px;
            margin: 0 0 12px;
        }
        .description{
            font-family: Georgia, serif;
            font-size: 16px;
            font-style: italic;
            color: #1d1d1d;
            word-spacing: 3px;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        hr{
            border: 1px solid #898989;
            margin-bottom: 15px;
        }
        h3{
            font-family: Georgia, serif;
            font-size: 24px;
            letter-spacing: 2px;
            margin: 0 0 15px;
        }
        .skills{
            font-weight: bold;
            word-spacing: 3px;
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="profile-image">🧑‍🎓</div>
        <h1>STUDENT PROFILE</h1>
        <h2>GOPINADH AYILA</h2>
        <p class="description">
            Learn continuously, and build a better tomorrow.
        </p>
    <hr>
    <h3>Skills</h3>
    <div class="skills">
      Python <span class="dot">•</span> SQL <span class="dot">•</span> Web Development
    </div>
    </div>
</body>
</html>
